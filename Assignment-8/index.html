<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omer - Student Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1 class="hero-title">Hi,<br>I'm Omer.</h1>
            <p class="hero-subtitle">Crafting clever copy that works harder than your morning coffee.</p>
            <a href="#system" class="pill-btn">Explore assignment</a>
        </div>
    </section>

    <section id="system" class="system-section">
        <div class="container reveal">
            <div class="section-header">
                <h2>Student Directory</h2>
                <p>Management System Workspace</p>
            </div>

            <div class="form-card">
                <h3>Add New Record</h3>
                <div class="input-grid">
                    <div class="input-group">
                        <label for="name">Student Name</label>
                        <input type="text" id="name" placeholder="John Doe" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="roll">Roll Number</label>
                        <input type="text" id="roll" placeholder="2026-001" autocomplete="off">
                    </div>
                    <div class="input-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" placeholder="20" autocomplete="off">
                    </div>
                    <button class="pill-btn submit-btn" onclick="addStudent()">Add Student</button>
                </div>
            </div>

            <div class="table-card">
                <table class="custom-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Roll Number</th>
                            <th>Age</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="div">
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <script src="app.js"></script>
</body>
</html>
